<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Starbucks Clone</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
<nav class="flex justify-between items-center px-10 py-5 shadow-md">

    <!-- Logo -->
    <div>
        <img src="images/logo..png" alt="Starbucks Logo" class="w-15">
    </div>

    <!-- Menu -->
    <ul class="flex gap-8 font-semibold">
        <li><a href="#">MENU</a></li>
        <li><a href="#">REWARDS</a></li>
        <li><a href="#">GIFT CARDS</a></li>
    </ul>

    <!-- Right Side -->
    <div class="flex items-center gap-4">
        <button class="border border-black px-4 py-2 rounded-full">
            Sign In
        </button>

        <button class="bg-black text-white px-4 py-2 rounded-full">
            Join Now
        </button>
    </div>

</nav>
</body>
</html>
